[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tally-prime-importer"
version = "1.0.0"
description = "Python desktop app to convert Excel accounting data into Tally Prime-compatible XML for import"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0,<3.0.0",
    "openpyxl>=3.1.0,<4.0.0",
]

[project.scripts]
tally-importer = "main:main"
